# Base technology signatures. Data, not code — add/override in custom.yaml.
#
# Fields per technology:
#   category : language | backend | frontend | cms | server | analytics
#   confidence: low | medium | high   (base confidence when matched)
#   headers  : {Header-Name: regex}   (matched against that response header value)
#   server   : regex                  (matched against Server header)
#   cookies  : [regex, ...]           (matched against Set-Cookie / cookies)
#   html     : [regex, ...]           (matched against the root page body)
#   paths    : [{path: /x, status: 200, body: regex}]
#   version  : regex with (?P<version>...) group  (optional)
#   implies  : [OtherTech, ...]       (also record these when this matches)

# ---------- Languages / runtimes ----------
PHP:
  category: language
  confidence: high
  headers:
    X-Powered-By: "PHP"
  cookies: ["^PHPSESSID="]
  html: ["\\.php(\\?|\"|')"]
  version: "PHP/(?P<version>\\d+\\.\\d+\\.\\d+)"

"Node.js":
  category: language
  confidence: medium
  headers:
    X-Powered-By: "Express"
  # Node rarely exposes itself directly; most detection is via its frameworks.

Java:
  category: language
  confidence: medium
  cookies: ["^JSESSIONID="]
  headers:
    X-Powered-By: "(Servlet|JSP|JBoss|WildFly)"

".NET":
  category: language
  confidence: high
  headers:
    X-Powered-By: "ASP\\.NET"
    X-AspNet-Version: ".+"
    X-AspNetMvc-Version: ".+"
  cookies: ["^ASP\\.NET_SessionId=", "^\\.AspNetCore"]
  version: "X-AspNet-Version: (?P<version>[\\d.]+)"

Python:
  category: language
  confidence: medium
  server: "(gunicorn|uwsgi|Werkzeug|waitress)"
  headers:
    X-Powered-By: "(Python|Flask|Django)"

Ruby:
  category: language
  confidence: medium
  server: "(Phusion Passenger|thin|puma|WEBrick|Unicorn)"
  cookies: ["^_session_id="]

Go:
  category: language
  confidence: low
  server: "^Go-http-client"

# ---------- Backend frameworks ----------
Laravel:
  category: backend
  confidence: high
  # laravel_session is specific; XSRF-TOKEN alone is NOT (Axios/Angular set it too),
  # so it is deliberately excluded here to avoid false positives on non-PHP apps.
  cookies: ["^laravel_session="]
  implies: ["PHP"]

Symfony:
  category: backend
  confidence: medium
  cookies: ["^sf_redirect=", "^symfony="]
  implies: ["PHP"]

Express:
  category: backend
  confidence: high
  headers:
    X-Powered-By: "Express"
  implies: ["Node.js"]

"Next.js":
  category: backend
  confidence: high
  headers:
    X-Powered-By: "Next\\.js"
  html: ["/_next/static/", "__NEXT_DATA__"]
  paths:
    - {path: "/_next/static/", status: 200}
  implies: ["Node.js", "React"]

Nuxt:
  category: backend
  confidence: high
  html: ["__NUXT__", "/_nuxt/"]
  implies: ["Node.js", "Vue"]

"Spring Boot":
  category: backend
  confidence: medium
  headers:
    X-Application-Context: ".+"
  html: ["Whitelabel Error Page"]
  implies: ["Java"]

Django:
  category: backend
  confidence: high
  cookies: ["^csrftoken=", "^django_language="]
  implies: ["Python"]

"Ruby on Rails":
  category: backend
  confidence: high
  cookies: ["^_rails", "^_[a-zA-Z0-9]+_session="]
  html: ["csrf-param", "data-turbo"]
  implies: ["Ruby"]

# ---------- Frontend frameworks (browser-side; say nothing about the server) ----------
Angular:
  category: frontend
  confidence: high
  html: ["ng-version=\"(?P<version>[\\d.]+)\"", "ng-app", "_nghost", "_ngcontent"]
  version: "ng-version=\"(?P<version>[\\d.]+)\""

React:
  category: frontend
  confidence: medium
  html: ["data-reactroot", "data-reactid", "__REACT_DEVTOOLS", "react(?:-dom)?(?:\\.production)?\\.min\\.js"]

"Vue.js":
  category: frontend
  confidence: medium
  html: ["data-v-[0-9a-f]{8}", "__VUE__", "vue(?:\\.runtime)?(?:\\.min)?\\.js"]

Svelte:
  category: frontend
  confidence: medium
  html: ["svelte-[0-9a-z]+", "__svelte"]

# ---------- CMS ----------
WordPress:
  category: cms
  confidence: high
  html: ["/wp-content/", "/wp-includes/", "<meta name=\"generator\" content=\"WordPress (?P<version>[\\d.]+)"]
  paths:
    - {path: "/wp-login.php", status: 200}
  version: "WordPress (?P<version>[\\d.]+)"
  implies: ["PHP"]

Drupal:
  category: cms
  confidence: high
  headers:
    X-Generator: "Drupal"
  html: ["/sites/default/files/", "Drupal.settings"]
  implies: ["PHP"]

Joomla:
  category: cms
  confidence: medium
  html: ["/media/jui/", "content=\"Joomla"]
  implies: ["PHP"]

# ---------- Web servers ----------
nginx:
  category: server
  confidence: high
  server: "nginx"
  version: "nginx/(?P<version>[\\d.]+)"

Apache:
  category: server
  confidence: high
  server: "Apache"
  version: "Apache/(?P<version>[\\d.]+)"

IIS:
  category: server
  confidence: high
  server: "Microsoft-IIS"
  version: "Microsoft-IIS/(?P<version>[\\d.]+)"

LiteSpeed:
  category: server
  confidence: high
