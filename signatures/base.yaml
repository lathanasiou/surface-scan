Caddy:
  category: server
  confidence: medium
  server: "Caddy"

# ---------- Analytics / third-party ----------
"Google Analytics":
  category: analytics
  confidence: low
  html: ["google-analytics\\.com/analytics\\.js", "gtag\\(", "googletagmanager\\.com/gtm\\.js"]

